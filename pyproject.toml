[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "feed-spine"
version = "0.3.0"
description = "Storage-agnostic, executor-agnostic feed capture framework"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Ryan McCoy" }]
keywords = ["feeds", "data-pipeline", "etl", "medallion", "capture"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.0",
    "structlog>=24.0",
]

[project.optional-dependencies]
# Storage
sqlalchemy = ["sqlalchemy[asyncio]>=2.0", "alembic>=1.13"]
postgres = ["asyncpg>=0.29"]
duckdb = [
    "duckdb>=1.0",
]
redis = ["redis>=5.0"]

# Search
elasticsearch = [
    "elasticsearch[async]>=8.0",
]

# Entity resolution
entity = ["entityspine>=0.1.0"]

# API
api = [
    "fastapi>=0.111",
    "uvicorn>=0.30",
]

# Bundles
storage-all = ["asyncpg>=0.29", "duckdb>=1.0", "redis>=5.0"]
all = [
    "asyncpg>=0.29",
    "duckdb>=1.0",
    "redis>=5.0",
    "entityspine>=0.1.0",
    "elasticsearch[async]>=8.0",
    "fastapi>=0.111",
    "uvicorn>=0.30",
]

# Development
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.9.0",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "interrogate>=1.7",
]

# Documentation
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
    "mkdocs-gen-files>=0.5",
    "mkdocs-literate-nav>=0.6",
]



[project.scripts]
feedspine = "feedspine.cli:app"
feedspine-mcp = "feedspine.transports.mcp.server:run"

[project.urls]
Homepage = "https://github.com/ryansmccoy/feed-spine"
Documentation = "https://ryansmccoy.github.io/feed-spine/"
Repository = "https://github.com/ryansmccoy/feed-spine"
Changelog = "https://github.com/ryansmccoy/feed-spine/blob/main/CHANGELOG.md"
Issues = "https://github.com/ryansmccoy/feed-spine/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/feedspine"]

# === UV CONFIG ===

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "interrogate>=1.7",
    # Docs
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
    "mkdocs-gen-files>=0.5",
    "mkdocs-literate-nav>=0.6",
    "pytz>=2025.2",
    "pytest-timeout>=2.4.0",
]

# === RUFF (replaces black, isort, flake8) ===
[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "B",   # flake8-bugbear
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "SIM", # flake8-simplify
    "UP",  # pyupgrade
    "W",   # pycodestyle warnings
]
ignore = [
    "E501", # line too long (handled by formatter)
    "E741", # ambiguous-variable-name (domain-specific)
    "F821", # undefined-name (dynamic __all__ members)
    "F822", # undefined-export (lazy __all__ members)
    "SIM108", # if-else-block-instead-of-if-exp (readability)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F822"]  # re-exports and lazy __all__ members
"src/feedspine/api/routes/*.py" = ["B008"]  # FastAPI Query defaults are idiomatic

[tool.ruff.lint.isort]
known-first-party = ["feedspine"]

# === MYPY ===
[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

# === PYTEST ===
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
timeout = 5  # 5 second timeout per test
addopts = "-v --tb=short --strict-markers -m 'not slow'"
doctest_optionflags = ["NORMALIZE_WHITESPACE", "ELLIPSIS"]
filterwarnings = [
    "ignore::DeprecationWarning",
]
markers = [
    "unit: Fast, isolated unit tests (no I/O, no external services)",
    "integration: Tests requiring real filesystem or services",
    "slow: Slow tests (subprocess examples, external calls)",
    "e2e: End-to-end tests requiring Docker or external services",
    "examples: Auto-discovered example verification tests",
    "network: Tests requiring network access",
    "timeout: Test timeout marker",
]

# === INTERROGATE (docstring coverage) ===
[tool.interrogate]
ignore-init-method = true
ignore-init-module = true
ignore-magic = true
ignore-semiprivate = true
ignore-private = true
ignore-property-decorators = true
ignore-module = false
ignore-nested-functions = true
ignore-nested-classes = true
fail-under = 80
verbose = 1
exclude = ["tests", "docs"]

[tool.coverage.run]
source = ["src/feedspine"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]
