name: feedspine-dev

services:
  # ============================================================
  # Database - DEV environment (standard port 5432)
  # ============================================================
  dev-postgres:
    image: postgres:16-alpine
    container_name: feedspine-dev-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-spine}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-spine}
      POSTGRES_DB: ${POSTGRES_DB:-feeds}
    ports:
      - "5432:5432"
    volumes:
      - dev_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-spine} -d ${POSTGRES_DB:-feeds}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    profiles:
      - dev

  # ============================================================
  # Redis - DEV environment (standard port 6379)
  # ============================================================
  dev-redis:
    image: redis:7-alpine
    container_name: feedspine-dev-redis
    ports:
      - "6379:6379"
    volumes:
      - dev_redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    profiles:
      - dev

  # ============================================================
  # Development shell with all dependencies
  # ============================================================
  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: feedspine-dev
    environment:
      PYTHONUNBUFFERED: "1"
      LOG_LEVEL: DEBUG
    volumes:
      - .:/app
      - /app/.venv
    working_dir: /app
    command: /bin/bash
    stdin_open: true
    tty: true
    depends_on:
      dev-postgres:
        condition: service_healthy
      dev-redis:
        condition: service_healthy
    profiles:
      - dev

volumes:
  dev_postgres_data:
  dev_redis_data:
