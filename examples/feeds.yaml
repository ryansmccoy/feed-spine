# FeedSpine feed configuration
# Generated by: feedspine collect init
# Docs: feedspine feeds list-types (for all available adapter types)

# Storage backend (default: in-memory)
# Overridable via --connection flag or FEEDSPINE_DATABASE_URL env var
storage:
  type: sqlite
  connection: feeds.db

# Search backend (optional — enables `feedspine query search`)
# search:
#   type: memory

# Feed definitions
feeds:
  # ── RSS feeds ──────────────────────────────────────────
  - name: hacker-news
    type: rss
    url: https://news.ycombinator.com/rss

  - name: lobsters
    type: rss
    url: https://lobste.rs/rss

  # ── SEC EDGAR filings ──────────────────────────────────
  # Uses the built-in SEC EDGAR adapter (type: sec_edgar)
  # - name: sec-10k-filings
  #   type: rss
  #   url: https://www.sec.gov/cgi-bin/browse-edgar?action=getcompany&type=10-K&output=atom
  #   requests_per_second: 0.5

  # ── JSON API feeds ─────────────────────────────────────
  # Supports env var interpolation: ${VAR} or ${VAR:-default}
